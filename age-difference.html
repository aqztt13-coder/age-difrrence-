<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة فرق العمر بين شخصين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f1; --card:#ffffff; --ink:#16302b; --muted:#5f7a73;
    --brand:#0f766e; --brand-dark:#0b5a54; --accent:#e9a23b;
    --a:#2563a8; --b:#b4477a; --line:#d6e2de; --err:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1816; --card:#162623; --ink:#e6f1ee; --muted:#93b0a8; --line:#294039;
      --brand:#2bb3a6; --brand-dark:#1f8c82; --a:#6aa6e8; --b:#e384b2;
    }
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;justify-content:center;padding:24px 14px;line-height:1.7}
  .wrap{width:100%;max-width:760px}
  header{text-align:center;margin-bottom:22px}
  header h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;color:var(--brand)}
  header p{color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;
    box-shadow:0 10px 30px rgba(15,60,52,.08)}
  .people{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:600px){.people{grid-template-columns:1fr}}
  .person{border:2px solid var(--line);border-radius:14px;padding:16px;transition:border-color .2s}
  .person.a{border-top:6px solid var(--a)} .person.b{border-top:6px solid var(--b)}
  .person h2{font-size:1.1rem;margin-bottom:10px}
  .person.a h2{color:var(--a)} .person.b h2{color:var(--b)}
  label{display:block;font-size:.9rem;color:var(--muted);margin:8px 0 4px}
  input{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--bg);
    border:1.5px solid var(--line);border-radius:10px}
  input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
  button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:12px;padding:12px 22px;
    transition:transform .1s,background .2s}
  button:active{transform:scale(.97)}
  .primary{flex:1;background:var(--brand);color:#fff;font-size:1.05rem}
  .primary:hover{background:var(--brand-dark)}
  .ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
  .ghost:hover{background:var(--bg)}
  .error{display:none;margin-top:14px;color:var(--err);font-weight:600;text-align:center}
  #result{display:none;margin-top:20px}
  .verdict{text-align:center;font-size:1.15rem;font-weight:700;margin-bottom:14px}
  .main-diff{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .box{background:var(--bg);border-radius:14px;padding:14px 6px;text-align:center;border:1px solid var(--line)}
  .box strong{display:block;font-size:2rem;font-weight:800;color:var(--brand);line-height:1.2}
  .box span{color:var(--muted);font-size:.95rem}
  table{width:100%;border-collapse:collapse;font-size:.95rem}
  td{padding:9px 6px;border-bottom:1px solid var(--line)}
  td:last-child{font-weight:700;text-align:left}
  .ages{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .age{border-radius:12px;padding:10px;text-align:center;color:#fff;font-weight:600}
  .age.a{background:var(--a)} .age.b{background:var(--b)}
  .age small{display:block;font-weight:400;opacity:.9}
  footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:18px}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>حاسبة فرق العمر</h1>
    <p>أدخل تاريخ ميلاد شخصين لمعرفة الفرق بينهما بدقة</p>
  </header>

  <section class="card">
    <div class="people">
      <div class="person a">
        <h2>الشخص الأول</h2>
        <label for="n1">الاسم (اختياري)</label>
        <input id="n1" type="text" placeholder="مثال: أحمد">
        <label for="d1">تاريخ الميلاد</label>
        <input id="d1" type="date">
      </div>
      <div class="person b">
        <h2>الشخص الثاني</h2>
        <label for="n2">الاسم (اختياري)</label>
        <input id="n2" type="text" placeholder="مثال: سارة">
        <label for="d2">تاريخ الميلاد</label>
        <input id="d2" type="date">
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="calc">احسب الفرق</button>
      <button class="ghost" id="swap" title="تبديل الشخصين">تبديل</button>
      <button class="ghost" id="reset">مسح</button>
    </div>
    <p class="error" id="err" role="alert"></p>

    <div id="result" aria-live="polite">
      <p class="verdict" id="verdict"></p>
      <div class="main-diff">
        <div class="box"><strong id="rY">0</strong><span>سنة</span></div>
        <div class="box"><strong id="rM">0</strong><span>شهر</span></div>
        <div class="box"><strong id="rD">0</strong><span>يوم</span></div>
      </div>
      <div class="ages">
        <div class="age a"><span id="l1"></span><small id="a1"></small></div>
        <div class="age b"><span id="l2"></span><small id="a2"></small></div>
      </div>
      <table>
        <tr><td>إجمالي الأشهر</td><td id="tMonths"></td></tr>
        <tr><td>إجمالي الأسابيع</td><td id="tWeeks"></td></tr>
        <tr><td>إجمالي الأيام</td><td id="tDays"></td></tr>
        <tr><td>إجمالي الساعات</td><td id="tHours"></td></tr>
      </table>
    </div>
  </section>
  <footer>الحساب يعتمد على التقويم الميلادي</footer>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const fmt = n => n.toLocaleString('ar-EG');
  const today = new Date().toISOString().split('T')[0];
  $('d1').max = $('d2').max = today;

  // فرق بين تاريخين بالسنوات والأشهر والأيام
  function diff(from, to){
    let y = to.getFullYear() - from.getFullYear();
    let m = to.getMonth() - from.getMonth();
    let d = to.getDate() - from.getDate();
    if (d < 0){ m--; d += new Date(to.getFullYear(), to.getMonth(), 0).getDate(); }
    if (m < 0){ y--; m += 12; }
    return {y, m, d};
  }
  const txt = o => `${fmt(o.y)} سنة، ${fmt(o.m)} شهر، ${fmt(o.d)} يوم`;

  function showError(msg){ const e=$('err'); e.textContent=msg; e.style.display='block'; $('result').style.display='none'; }

  $('calc').onclick = function(){
    $('err').style.display='none';
    if(!$('d1').value || !$('d2').value) return showError('الرجاء إدخال تاريخ ميلاد الشخصين.');
    const t1 = new Date($('d1').value), t2 = new Date($('d2').value);
    const now = new Date();
    if(t1 > now || t2 > now) return showError('تاريخ الميلاد لا يمكن أن يكون في المستقبل.');

    const n1 = $('n1').value.trim() || 'الشخص الأول';
    const n2 = $('n2').value.trim() || 'الشخص الثاني';
    const [older, younger, on, yn] = t1 <= t2 ? [t1,t2,n1,n2] : [t2,t1,n2,n1];
    const r = diff(older, younger);
    const days = Math.round((younger - older) / 86400000);

    $('verdict').textContent = days === 0
      ? `${n1} و${n2} من نفس تاريخ الميلاد`
      : `${on} أكبر من ${yn} بـ ${txt(r)}`;
    $('rY').textContent = fmt(r.y); $('rM').textContent = fmt(r.m); $('rD').textContent = fmt(r.d);
    $('l1').textContent = n1; $('a1').textContent = 'العمر الآن: ' + txt(diff(t1, now));
    $('l2').textContent = n2; $('a2').textContent = 'العمر الآن: ' + txt(diff(t2, now));
    $('tMonths').textContent = fmt(r.y*12 + r.m);
    $('tWeeks').textContent = fmt(Math.floor(days/7));
    $('tDays').textContent = fmt(days);
    $('tHours').textContent = fmt(days*24);
    $('result').style.display='block';
    $('result').scrollIntoView({behavior:'smooth', block:'nearest'});
  };

  $('swap').onclick = function(){
    [$('n1').value,$('n2').value] = [$('n2').value,$('n1').value];
    [$('d1').value,$('d2').value] = [$('d2').value,$('d1').value];
    if($('d1').value && $('d2').value) $('calc').click();
  };
  $('reset').onclick = function(){
    ['n1','n2','d1','d2'].forEach(i => $(i).value='');
    $('result').style.display='none'; $('err').style.display='none';
  };
})();
</script>
</body>
</html>
